<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HARBOR HEAT — Solara Bay</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="view" aria-label="HARBOR HEAT, an open-world crime game set in Solara Bay"></canvas>

<div id="hud" class="hidden">
  <div id="minimap-wrap">
    <canvas id="minimap" width="220" height="220"></canvas>
    <div id="minimap-north">N</div>
    <div id="bars"><div class="bar health"><i id="hp-fill"></i></div><div class="bar armor"><i id="ar-fill"></i></div></div>
    <div id="district"></div>
  </div>
  <div id="topright">
    <div id="clock">16:30</div>
    <div id="weapon"><span id="weapon-name">FISTS</span><span id="ammo"></span></div>
    <div id="cash">$0</div>
    <div id="stars"></div>
  </div>
  <div id="objective"></div>
  <div id="subtitle"></div>
  <div id="feed"></div>
  <div id="speedo"><b id="speed">0</b><small>KM/H</small><div id="car-hp"><i></i></div><span id="radio"></span></div>
  <div id="crosshair"></div>
  <div id="hitmark"></div>
  <div id="prompt"></div>
  <div id="timer"></div>
  <div id="damage-vignette"></div>
</div>

<div id="bigmsg"></div>
<div id="flash"></div>

<div id="title" class="screen">
  <div class="logo"><span class="l1">HARBOR</span><span class="l2">HEAT</span><em>Solara Bay</em></div>
  <nav id="title-menu"></nav>
  <p class="tag">An original open-world crime story. Keyboard + mouse. Best with sound on.</p>
</div>

<div id="pause" class="screen hidden"><div class="panel"><h2 id="pause-title">PAUSED</h2><nav id="pause-menu"></nav><div id="pause-body"></div></div></div>

<div id="bigmap" class="screen hidden"><canvas id="bigmap-canvas" width="900" height="760"></canvas><div class="legend">M / Esc to close · <b class="y">●</b> mission · <b class="g">●</b> safehouse · <b class="o">●</b> gun shop · <b class="c">●</b> sun tokens</div></div>

<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
